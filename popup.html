<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 310px;
            padding: 15px;
            margin: 0;
            background-color: #f9f9f9;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h3 {
            margin: 0;
            color: #333;
            font-size: 15px;
        }

        .lang-select {
            padding: 3px 6px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        label.field-label {
            font-size: 13px;
            color: #555;
            display: block;
            margin-bottom: 6px;
        }

        select.full-width {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* Switch Component Styles */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #1a73e8;
        }

        input:checked+.slider:before {
            transform: translateX(18px);
        }

        [dir="rtl"] input:checked+.slider:before {
            transform: translateX(-18px);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1557b0;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            min-height: 18px;
            line-height: 1.4;
        }
    </style>
</head>

<body dir="ltr">
    <div class="header-row">
        <h3 id="uiTitle">Bookmark Organizer</h3>
        <select id="langSelect" class="lang-select">
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>
    </div>

    <label for="folderSelect" class="field-label" id="uiFolderLabel">Select folder to organize:</label>
    <select id="folderSelect" class="full-width">
        <option value="" id="uiLoading">Loading folders...</option>
    </select>

    <!-- Toggle Switch -->
    <label class="switch-container">
        <div class="switch">
            <input type="checkbox" id="dedupeToggle" checked>
            <span class="slider"></span>
        </div>
        <span id="uiDedupeLabel">Remove duplicate URLs (ignore #hash)</span>
    </label>

    <button id="organizeBtn">Organize Selected Folder</button>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
